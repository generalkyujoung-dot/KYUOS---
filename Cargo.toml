[package]
name = "os"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "os"
test = true
bench = false

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[dependencies]
bootloader = { version = "0.9", features = ["vga_320x200"] }
volatile = "0.2.6"
lazy_static = { version = "1.0", features = ["spin_no_std"] }
spin = "0.5.2"
x86_64 = "0.15.5"
uart_16550 = "0.6.0"
font8x8 = { version = "0.3", default-features = false, features = ["unicode"] }
pic8259 = "0.11"        # 8259 PIC (하드웨어 인터럽트 컨트롤러)
pc-keyboard = "0.7.0"   # 스캔코드 -> 글자 변환

[package.metadata.bootimage]
run-args = ["-serial", "stdio"]
test-args = [
    "-device", "isa-debug-exit,iobase=0xf4,iosize=0x04", "-serial", "stdio",
    "-display", "none"
]
test-success-exit-code = 33
test-timeout = 10